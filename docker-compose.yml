services:
  bot1:
    build: .
    image: bot3:latest
    container_name: bot1
    env_file:
      - .env.bot1
    restart: always
    cpus: 8
    mem_limit: 24g
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - web
    privileged: true

  bot2:
    build: .
    image: bot3:latest
    container_name: bot2
    env_file:
      - .env.bot2
    restart: always
    cpus: 8
    mem_limit: 24g
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - web
    privileged: true

  bot3:
    build: .
    image: bot3:latest
    container_name: bot3
    env_file:
      - .env.bot3
    restart: always
    cpus: 8
    mem_limit: 24g
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - web
    privileged: true

networks:
  web:
    external: true
