

services:
  bot1:
    build: .
    image: bot3:latest
    container_name: bot1
    env_file:
      - .env.bot1
    # no external volumes required
  restart: always
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  bot2:
    build: .
    image: bot3:latest
    container_name: bot2
    env_file:
      - .env.bot2
    # no external volumes required
  restart: always
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  bot3:
    build: .
    image: bot3:latest
    container_name: bot3
    env_file:
      - .env.bot3
    # no external volumes required
  restart: always
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
