services:
  bot1:
    build: .
    image: bot3:latest
    container_name: bot1
    env_file:
      - .env.bot1
    restart: always
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - web
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.core.rmem_max=2500000
      - net.core.wmem_max=2500000

  bot2:
    build: .
    image: bot3:latest
    container_name: bot2
    env_file:
      - .env.bot2
    restart: always
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - web
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.core.rmem_max=2500000
      - net.core.wmem_max=2500000

  bot3:
    build: .
    image: bot3:latest
    container_name: bot3
    env_file:
      - .env.bot3
    restart: always
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - web
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.core.rmem_max=2500000
      - net.core.wmem_max=2500000

networks:
  web:
    external: true
