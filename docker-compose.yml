

services:
  bot:
    build: .
    image: bot3:latest
    container_name: bot3
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./devices.json:/app/devices.json:ro
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
